운용측이 업데이트사항을 매번 볼 수 잇는 방향을 선호하긴 함. \n\n4. 1기 설문조사 + 연장희망 수요조사 진행 -> 2기 희망자는 최대한 가져가는 중\n5. 내부심사 기준을 세우기(협업 효과레벨)\n6. 최대 800만원 기준으로 리스트업리뉴얼\n7. 5월 하이라이트 업데이트 확인 할 것.\n8. 지금 집중할 부분: 단일종목레버리지(TIGER 운용보수가 가장 적다는 부분, KODEX 레버리지 비율이 9할인 상황)\n분위기 조성이 필요함."}}, {"id": "t_1gbw97", "date": "2026-05-18", "cells": {"content": "1기 설문조사 제작", "todo": "", "status": "", "owner": "", "memo": ""}}, {"id": "t_y5nnlp", "date": "2026-05-19", "cells": {"content": "1기 설문조사", "todo": "", "status": "", "owner": "", "memo": ""}}, {"id": "t_aocpk4", "date": "2026-05-20", "cells": {"content": "1기 설문조사", "todo": "", "status": "", "owner": "", "memo": ""}}, {"id": "t_7wmapz", "date": "2026-05-21", "cells": {"content": "1기 설문조사", "todo": "", "status": "", "owner": "", "memo": ""}}, {"id": "t_uah2ml", "date": "2026-05-22", "cells": {"content": "TIGER 팬페스타", "todo": "", "status": "", "owner": "", "memo": ""}}, {"id": "t_tkcst2", "date": "2026-05-24", "cells": {"content": "호랑이클럽 2기 모집 안내문 발송", "todo": "", "status": "", "owner": "", "memo": ""}}, {"id": "t_ajlvux", "date": "2026-05-25", "cells": {"content": "2기 준비 미팅", "todo": "", "status": "", "owner": "", "memo": ""}}, {"id": "t_wreed4", "date": "2026-05-27", "cells": {"content": "2기 모집", "todo": "", "status": "", "owner": "", "memo": ""}}, {"id": "t_xidvcs", "date": "2026-05-28", "cells": {"content": "미래에셋증권운용사 미팅, 2기 명단 확정", "todo": "", "status": "", "owner": "", "memo": "-> 이벤트로 고정하는것(official) / \n<- TIGER ETF를 어느정도 노출시켜도 되는건지 / 하면 좋은건지?\n\n->2기 방향성\n상품노출되지 않는 이벤트(1일~10일 업로드, 캡쳐본으로 기록 괜찮음)\n신규상품이 (상품명)(신규상장날) 노출되면 가장 BEST\n\n-> 2기 확정 / 협업액 통일(850내) / 웹세미나만 들어올 생각있는지\n-> [뉴스레터] 해당 상품을 참고하여 자율 콘텐츠 진행. 6/2\n-> (함께성장용) 웹세비나, 보라개미 시황, 시장 업데이트\n-> 2기 단톡방 새로 생성/ 컨텐츠는 단톡방에 업로드하며/ 진행상황 매주 업데이트\n-> 치즈가 컨텐츠 중요도를 개별 DM으로 언급할것"}}, {"id": "t_2dmbu2", "date": "2026-05-29", "cells": {"content": "꿀비님 A타입 추가", "todo": "", "status": "", "owner": "", "memo": ""}}, {"id": "t_acmwb2", "date": "2026-05-30", "cells": {"content": "2기 단톡방 초대", "todo": "", "status": "", "o function migrateToCohorts(parsed){
  // 예전 버전(기수 개념 없음) 데이터를 1~2기 코호트로 이전
  if(parsed && !parsed.cohorts && parsed.creators){
    const evalMonths = (parsed.settings && parsed.settings.evalMonths) || [];
    parsed.cohorts = [
      {id:"gen1_2", label:"1~2기 (2026년 6~8월)", evalMonths, creators: parsed.creators},
      {id:"gen3", label:"3기", evalMonths:[], creators:[]},
      {id:"gen4", label:"4기", evalMonths:[], creators:[]},
    ];
    parsed.currentCohortId = "gen1_2";
    delete parsed.creators;
    if(parsed.settings) delete parsed.settings.evalMonths;
  }
  return parsed;
}
function migrateSplitGen12(parsed){
  // 기존 "1~2기" 통합 코호트(gen1_2)를 1기 / 2기로 분리
  if(parsed && parsed.cohorts){
    const idx = parsed.cohorts.findIndex(c=>c.id==="gen1_2");
    if(idx !== -1){
      const old = parsed.cohorts[idx];
      const gen1 = {id:"gen1", label:"1기", evalMonths:[], creators:[]};
      const gen2 = {id:"gen2", label:"2기 (2026년 6~8월)", evalMonths: old.evalMonths||[], creators: old.creators||[]};
      parsed.cohorts.splice(idx, 1, gen1, gen2);
      if(parsed.currentCohortId === "gen1_2") parsed.currentCohortId = "gen2";
    }
  }
  return parsed;
}
function migrateSeedGen3(parsed){
  // 브라우저에 저장된 예전 데이터의 3기가 아직 비어있으면(직접 수정 안 한 상태) 최신 시드의 3기 데이터로 채워줌
  if(parsed && parsed.cohorts){
    const gen3 = parsed.cohorts.find(c=>c.id==="gen3");
    const seedGen3 = SEED.cohorts.find(c=>c.id==="gen3");
    if(gen3 && seedGen3 && (gen3.creators||[]).length===0 && (gen3.evalMonths||[]).length===0 && seedGen3.creators.length>0){
      gen3.evalMonths = JSON.parse(JSON.stringify(seedGen3.evalMonths));
      gen3.creators = JSON.parse(JSON.stringify(seedGen3.creators));
    }
  }
  return parsed;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrateSeedGen3(migrateSplitGen12(migrateToCohorts(JSON.parse(raw))));
  }catch(e){}
  const s = JSON.parse(JSON.stringify(SEED));
  s.updatedAt = Date.now();
  return s;
}

/* ---------------- 활동사항 채점 로직 ---------------- */
function computeEvalDerived(cohort){
  const s = state.settings;
  const evalMonths = cohort.evalMonths;
  const withSchedule = cohort.creators.map(c=>{
    let totalItems=0, checkedItems=0;
    evalMonths.forEach(m=>{
      const md = c.months[m.id];
      (m.items||[]).forEach(it=>{
        totalItems++;
        if(md && md.checklist && md.checklist[it.id]) checkedItems++;
      });
    });
    const missed = totalItems-checkedItems;
    const autoScore = missed===0 ? 5 : (missed<=2 ? 3 : 1);
    const scheduleScore = (c.scheduleOverride!==null && c.scheduleOverride!==undefined) ? c.scheduleOverride : autoScore;

    let followers = 0;
    for(let i=evalMonths.length-1;i>=0;i--){
      const mid = evalMonths[i].id;
      if(c.followers && c.followers[mid]){ followers = c.followers[mid]; break; }
    }

    const sums = [];
    evalMonths.forEach(m=>{
      const md = c.months[m.id];
      if(md && md.metrics){
        const sum = s.metricFields.reduce((acc,f)=> acc + (Number(md.metrics[f.id])||0), 0);
        if(sum>0) sums.push(sum);
      }
    });
    const avgReaction = sums.length ? sums.reduce((a,b)=>a+b,0)/sums.length : 0;
    const rate = followers>0 ? avgReaction/followers : 0;

    return {...c, totalItems, checkedItems, missed, autoScore, scheduleScore, followers, avgReaction, rate};
  });

  const n = withSchedule.length;
  const sorted = [...withSchedule].sort((a,b)=>b.rate-a.rate);
  const topCount = n<=2?1:Math.max(1,Math.round(n/3));
  const bottomCount = n<=2?1:Math.max(1,Math.round(n/3));
  const perfMap = new Map();
  sorted.forEach((c,idx)=>{
    let perf;
    if(n===1) perf=5;
    else if(n===2) perf = idx===0?5:1;
    else if(idx<topCount) perf=5;
    else if(idx>=n-bottomCount) perf=1;
    else perf=3;
    perfMap.set(c.id,perf);
  });

  return withSchedule.map(c=>{
    const performanceScore = perfMap.get(c.id);
    const totalScore = c.scheduleScore + performanceScore;
    let status, statusClass;
    if(c.followers >= s.graduationFollowers){ status="Graduation"; statusClass="chip-graduation"; }
    else if(totalScore >= s.passMin){ status="Pass"; statusClass="chip-pass"; }
    else if(totalScore >= s.reviewMin){ status="Review"; statusClass="chip-review"; }
    else { status="Adjust"; statusClass="chip-adjust"; }
    return {...c, performanceScore, totalScore, status, statusClass};
  });
}

function ensureMonth(c, monthId){
  if(!c.months[monthId]) c.months[monthId] = {checklist:{}, note:"", link:"", metrics:{}, settlement:{}, extraContents:[]};
  if(!c.months[monthId].extraContents) c.months[monthId].extraContents = [];
  if(!c.followers) c.followers = {};
  if(c.followers[monthId]===undefined) c.followers[monthId] = 0;
  return c.months[monthId];
}

/* "구분" 컬럼(A/B) 컬러 배지 */
// 활동사항 크리에이터 이름과 명단 닉네임 표기가 다른 경우를 위한 별칭 매핑
const CREATOR_NAME_ALIASES = { "꿀돈이": "꿀돈", "샐러리부부": "금융권부부" };
function findRosterRowForCreator(c){
  const rows = (state.roster && state.roster.rows) || [];
  const h = (c.handle||"").trim().toLowerCase();
  if(h){
    const byHandle = rows.find(r => (r.cells.handle||"").trim().toLowerCase() === h);
    if(byHandle) return byHandle;
  }
  const n = (c.name||"").trim().toLowerCase();
  if(n){
    const byName = rows.find(r => (r.cells.nickname||"").trim().toLowerCase() === n);
    if(byName) return byName;
  }
  const alias = CREATOR_NAME_ALIASES[(c.name||"").trim()];
  if(alias){
    const byAlias = rows.find(r => (r.cells.nickname||"").trim() === alias);
    if(byAlias) return byAlias;
  }
  return null;
}
function creatorTypeFromRoster(c){
  const row = findRosterRowForCreator(c);
  return row ? (row.cells.type || "") : "";
}
function typeBadgeHtml(val){
  if(val==="A") return `<span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800 border border-yellow-300">A</span>`;
  if(val==="B") return `<span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-sky-100 text-sky-800 border border-sky-300">B</span>`;
  if(val==="P") return `<span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-violet-100 text-violet-800 border border-violet-300">P</span>`;
  if(!val) return `<span class="text-slate-300">-</span>`;
  return `<span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-300">${escHtml(val)}</span>`;
}

function cellDisplayContent(tableKey, row, col){
  const val = row.cells[col.id];
  if(col.id==="type") return typeBadgeHtml(val);
  if(val==="" || val===undefined || val===null) return `<span class="text-slate-300">-</span>`;
  if(col.type==="url") return `<span class="text-blue-600 truncate block">${escHtml(val)}</span>`;
  return `<div class="truncate max-w-[240px]" title="${esc(val)}">${escHtml(val)}</div>`;
}

function cellEditHtml(tableKey, row, col){
  const val = row.cells[col.id];
  const base = "w-full border border-slate-300 rounded-lg px-2 py-1 shadow-sm";
  if(col.type==="textarea"){
    return `<textarea id="active-cell-input" onblur="commitCell('${tableKey}','${row.id}','${col.id}', this.value)" onkeydown="if(event.key==='Escape'){cancelEditCell();}" class="${base} min-w-[180px]" rows="2">${escHtml(val)}</textarea>`;
  }
  if(col.type==="select"){
    const opts = (col.options||[]).map(o=>`<option value="${esc(o)}" ${val===o?"selected":""}>${escHtml(o)}</option>`).join("");
    return `<select id="active-cell-input" onchange="commitCell('${tableKey}','${row.id}','${col.id}', this.value)" onblur="commitCell('${tableKey}','${row.id}','${col.id}', this.value)" class="${base}"><option value="">-</option>${opts}</select>`;
  }
  const type = col.type==="number" ? "number" : (col.type==="date" ? "date" : "text");
  return `<input id="active-cell-input" type="${type}" value="${esc(val)}" onblur="commitCell('${tableKey}','${row.id}','${col.id}', this.value)" onkeydown="if(event.key==='Enter'){this.blur();} if(event.key==='Escape'){cancelEditCell();}" class="${base} min-w-[110px]" />`;
}

function cellHtml(tableKey, row, col){
  if(col.type==="checkbox"){
    const val = row.cells[col.id];
    return `<input type="checkbox" ${val?"checked":""} onchange="updateCell('${tableKey}','${row.id}','${col.id}', this.checked)" class="w-4 h-4" />`;
  }
  const isEditing = editingCell && editingCell.tableKey===tableKey && editingCell.rowId===row.id && editingCell.colId===col.id;
  if(isEditing) return cellEditHtml(tableKey, row, col);
  return `<div class="cell-view" onclick="startEditCell('${tableKey}','${row.id}','${col.id}')">${cellDisplayContent(tableKey, row, col)}</div>`;
}

function monthDotsHtml(c, m){

/* 필터 / 정렬 상태 */
let evalFilter = { search: "", statuses: new Set() };
let evalSort = { key: "totalScore", dir: "desc" };

function setEvalSearch(value){ evalFilter.search = value; render(); }
function toggleStatusFilter(status){
  if(evalFilter.statuses.has(status)) evalFilter.statuses.delete(status);
  else evalFilter.statuses.add(status);
  render();
}
function resetEvalFilter(){
  evalFilter = { search: "", statuses: new Set() };
  evalSort = { key: "totalScore", dir: "desc" };
  render();
}
function setEvalSort(key){
  if(evalSort.key === key){ evalSort.dir = evalSort.dir === "asc" ? "desc" : "asc"; }
  else { evalSort.key = key; evalSort.dir = (key === "name") ? "asc" : "desc"; }
  render();
}
function sortArrow(key){
  if(evalSort.key !== key) return `<span class="text-slate-300">↕</span>`;
  return evalSort.dir === "asc" ? `<span class="text-slate-700">▲</span>` : `<span class="text-slate-700">▼</span>`;
}
const STATUS_RANK = { Graduation: 4, Pass: 3, Review: 2, Adjust: 1 };
function applyEvalFilterSort(derived){
  let list = derived.filter(c=>{
    const q = evalFilter.search.trim().toLowerCase();
    const matchesSearch = !q || c.name.toLowerCase().includes(q) || (c.handle||"").toLowerCase().includes(q);
    const matchesStatus = evalFilter.statuses.size === 0 || evalFilter.statuses.has(c.status);
    return matchesSearch && matchesStatus;
  });
  const key = evalSort.key, dir = evalSort.dir === "asc" ? 1 : -1;
  list = [...list].sort((a,b)=>{
    let av, bv;
    if(key === "name"){ av = a.name; bv = b.name; return av.localeCompare(bv) * dir; }
    if(key === "status"){ av = STATUS_RANK[a.status]||0; bv = STATUS_RANK[b.status]||0; }
    else { av = Number(a[key])||0; bv = Number(b[key])||0; }
    return (av - bv) * dir;
  });
  return list;
}

function metricEmoji(id){
  if(id==="views") return "👁️";
  if(id==="saves") return "💾";
  if(id==="shares") return "📤";
  if(id==="likes") return "❤️";

function donutFollowerCardHtml(list){
  const total = list.reduce((sum,c)=> sum + (c.followers||0), 0);
  const R = 45, C = 2*Math.PI*R;
  const sorted = [...list].sort((a,b)=> (b.followers||0)-(a.followers||0));
  const n = Math.max(1, sorted.length);
  const colored = sorted.map((c,i)=> ({...c, color: `hsl(${Math.round(i*360/n)},65%,55%)`}));
  let offset = 0;
  const segs = colored.map(c=>{
    const frac = total>0 ? (c.followers||0)/total : 0;
    const dash = frac*C;
    const html = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${c.color}" stroke-width="14" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"><title>${escHtml(c.name||"")}: ${fmtNum(c.followers||0)}명 (${(frac*100).toFixed(1)}%)</title></circle>`;
    offset += dash;
    return html;
  }).join("");
  const legend = colored.map(c=>{
    const pct = total>0 ? ((c.followers||0)/total*100).toFixed(1) : "0.0";
    return `<div class="flex items-center gap-1.5 text-xs"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${c.color}"></span><span class="truncate flex-1">${escHtml(c.name||"")}</span><span class="text-slate-400 tabular-nums shrink-0">${pct}%</span></div>`;
  }).join("");
  return `
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex items-center gap-5">
      <div class="relative w-28 h-28 shrink-0">
        <svg viewBox="0 0 120 120" class="w-28 h-28 -rotate-90">
          <circle cx="60" cy="60" r="${R}" fill="none" stroke="#e2e8f0" stroke-width="14" />
          ${segs}
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <div class="text-[10px] text-slate-400">합산 팔로워</div>
          <div class="stat-count font-extrabold text-slate-800 text-base tabular-nums" data-target="${total}">0</div>
        </div>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-xs font-semibold text-slate-500 mb-2">크리에이터별 팔로워 비중 (${list.length}명)</div>
        <div class="space-y-1 max-h-28 overflow-y-auto pr-1">
          ${legend || `<div class="text-xs text-slate-300">데이터 없음</div>`}
        </div>
      </div>
    </div>
  `;
}

function metricStatsCardHtml(cohort, list){
  const s = state.settings;
  const fields = s.metricFields || [];
  const sums = fields.map(f=>{
    let total = 0;
    (cohort.evalMonths||[]).forEach(m=>{

        const md = c.months ? c.months[m.id] : null;
        if(md && md.metrics) total += Number(md.metrics[f.id]) || 0;

  return `

    </div>
  `;
}

function animateStatNumbers(){
  const els = document.querySelectorAll(".stat-count");
  els.forEach(el=>{
    const target = Number(el.getAttribute("data-target")) || 0;
    const duration = 900;
    const start = (typeof performance !== "undefined" ? performance.now() : Date.now());
    function step(now){
      const p = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      const val = Math.round(target*eased);
      el.textContent = val.toLocaleString("ko-KR");
      if(p<1) requestAnimationFrame(step);
      else el.textContent = target.toLocaleString("ko-KR");
    }
    requestAnimationFrame(step);
  });
}

/* ---------------- 타임라인: 월별 캘린더 ---------------- */
let calState = (()=>{ const d=new Date(); return {year: d.getFullYear(), month: d.getMonth()+1}; })();
let timelineView = "calendar";
let modalState = null; // {dateStr, rowId, isNew}

function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function setTimelineView(v){ timelineView=v; render(); }
function shiftCalMonth(delta){
  let m = calState.month + delta, y = calState.year;
  if(m>12){ m=1; y++; } if(m<1){ m=12; y--; }
  calState = {year:y, month:m}; render();
}
function calToday(){
  const d=new Date(); calState = {year:d.getFullYear(), month:d.getMonth()+1}; render();
}
function buildMonthGrid(year, month){
  const first = new Date(year, month-1, 1);
  const startWeekday = (first.getDay()+6)%7; // 월=0 ... 일=6
  const gridStart = new Date(year, month-1, 1-startWeekday);
  const cells = [];
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    cells.push({day:d.getDate(), current: d.getMonth()===month-1, dateStr:`${d.getFullYear()}-${mm}-${dd}`});
  }
  return cells;
}
function pillClass(status){
  if(status==="완료") return "bg-green-100 text-green-700";
  if(status==="진행중") return "bg-blue-100 text-blue-700";
  if(status==="예정") return "bg-slate-200 text-slate-700";
  if(status==="사후관리") return "bg-purple-100 text-purple-700";
  return "bg-amber-100 text-amber-700";
}
function updateRowDate(rowId, value){
  const row = state.timeline.rows.find(r=>r.id===rowId); if(!row) return;
  row.date = value; saveState(); render();
}

function openEventModal(dateStr, rowId){
  if(rowId){ modalState = {dateStr, rowId, isNew:false}; render(); return; }
  const cells = {};
  state.timeline.columns.forEach(c=> cells[c.id] = c.type==="checkbox" ? false : "");
  const row = {id: rid("t"), date: dateStr, cells};
  state.timeline.rows.push(row);
  saveState();
  modalState = {dateStr, rowId: row.id, isNew:true};
  render();
}
function closeEventModal(){
  if(modalState && modalState.isNew){
    const row = state.timeline.rows.find(r=>r.id===modalState.rowId);
    const blank = row && Object.values(row.cells).every(v=> v==="" || v===false || v===undefined || v===null);
    if(blank){ state.timeline.rows = state.timeline.rows.filter(r=>r.id!==modalState.rowId); saveState(); }
  }
  modalState = null; render();
}
function modalUpdateDate(value){
  const row = state.timeline.rows.find(r=>r.id===modalState.rowId); if(!row) return;
  row.date = value; modalState.dateStr = value; saveState(); render();
}
function modalUpdateCell(colId, value){
  const row = state.timeline.rows.find(r=>r.id===modalState.rowId); if(!row) return;
  row.cells[colId] = value; saveState(); render();
}
function modalDeleteRow(){
  if(!confirm("이 일정을 삭제할까요?")) return;
  state.timeline.rows = state.timeline.rows.filter(r=>r.id!==modalState.rowId);
  modalState = null; saveState(); render();
}
function modalFieldInput(row, col){
  const val = row.cells[col.id];
  const onCh = `modalUpdateCell('${col.id}', this.value)`;
  if(col.type==="textarea") return `<textarea onchange="${onCh}" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 mt-0.5" rows="3">${escHtml(val)}</textarea>`;
  if(col.type==="select"){
    const opts=(col.options||[]).map(o=>`<option value="${esc(o)}" ${val===o?"selected":""}>${escHtml(o)}</option>`).join("");
    return `<select onchange="${onCh}" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 mt-0.5"><option value="">-</option>${opts}</select>`;
  }
  if(col.type==="checkbox") return `<input type="checkbox" ${val?"checked":""} onchange="modalUpdateCell('${col.id}', this.checked)" class="w-4 h-4 mt-1" />`;
  const type = col.type==="number" ? "number" : (col.type==="date" ? "date" : "text");
  return `<input type="${type}" value="${esc(val)}" onchange="${onCh}" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 mt-0.5" />`;
}
function renderEventModal(){
  if(!modalState) return "";
  const row = state.timeline.rows.find(r=>r.id===modalState.rowId);
  if(!row) return "";
  return `
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onclick="closeEventModal()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-5 max-h-[85vh] overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-slate-800">일정 상세</h3>
        <button onclick="closeEventModal()" class="text-slate-400 hover:text-slate-700">✕</button>
      </div>
      <label class="block mb-2">
        <span class="text-xs text-slate-500">날짜</span>
        <input type="date" value="${row.date}" onchange="modalUpdateDate(this.value)" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 mt-0.5" />
      </label>
      ${state.timeline.columns.map(c=>`
        <label class="block mb-2">
          <span class="text-xs text-slate-500">${escHtml(c.label)}</span>
          ${modalFieldInput(row, c)}
        </label>
      `).join("")}
      <div class="flex justify-between items-center mt-4">
        <button onclick="modalDeleteRow()" class="text-xs font-semibold text-red-500 hover:text-red-700">일정 삭제</button>
        <button onclick="closeEventModal()" class="px-4 py-1.5 text-sm font-semibold bg-slate-900 text-white rounded-lg hover:bg-slate-700">완료</button>
      </div>
    </div>
  </div>`;
}

function renderTimelineCalendar(){
  const cells = buildMonthGrid(calState.year, calState.month);
  const todayIso = todayStr();
  const weekdayLabels = ["월","화","수","목","금","토","일"];
  return `
    <div class="px-4 py-3">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <button onclick="shiftCalMonth(-1)" class="w-8 h-8 rounded-lg border border-slate-200 hover:bg-slate-50">‹</button>
          <div class="font-bold text-lg text-slate-800 w-32 text-center">${calState.year}년 ${calState.month}월</div>
          <button onclick="shiftCalMonth(1)" class="w-8 h-8 rounded-lg border border-slate-200 hover:bg-slate-50">›</button>
        </div>
        <button onclick="calToday()" class="px-3 py-1.5 text-xs font-semibold border border-slate-300 rounded-lg hover:bg-slate-50">오늘</button>

      <div class="grid grid-cols-7 border-t border-l border-slate-200">
        ${weekdayLabels.map(w=>`<div class="text-center text-xs font-semibold text-slate-500 py-2 border-b border-r border-slate-200 bg-slate-50">${w}</div>`).join("")}
        ${cells.map(cell=>{
          const rows = state.timeline.rows.filter(r=>r.date===cell.dateStr);
          const isToday = cell.dateStr===todayIso;
          return `
          <div class="cal-cell border-b border-r border-slate-200 ${cell.current?"bg-white":"bg-slate-50/60"}" onclick="openEventModal('${cell.dateStr}', null)">
            <div class="text-xs font-semibold mb-1 ${cell.current?"text-slate-700":"text-slate-300"}"><span class="${isToday?"inline-flex items-center justify-center w-5 h-5 rounded-full bg-red-500 text-white":""}">${cell.day}</span></div>
            <div class="space-y-1">
              ${rows.map(r=>`<div onclick="event.stopPropagation(); openEventModal('${cell.dateStr}','${r.id}')" class="text-[11px] px-1.5 py-0.5 rounded ${pillClass(r.cells.status)} truncate cursor-pointer" title="${escHtml(r.cells.content||r.cells.todo||"")}">${escHtml(r.cells.content || r.cells.todo || "(제목없음)")}</div>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
}

                  <span>${escHtml(c.label)}</span>
                  <button onclick="renameColumn('timeline','${c.id}')" class="text-slate-400 hover:text-slate-700 text-xs">✎</button>
                  <button onclick="deleteColumn('timeline','${c.id}')" class="text-slate-400 hover:text-red-600 text-xs">✕</button>
                </div>
              </th>`).join("")}
            <th class="px-2 py-2"></th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr class="border-b border-slate-50 hover:bg-slate-50/40 align-middle group">
              <td class="px-1 py-0.5"><input type="date" value="${r.date||""}" onchange="updateRowDate('${r.id}', this.value)" class="border border-slate-200 rounded px-1.5 py-1" /></td>
              ${t.columns.map(c=>`<td class="px-1 py-0.5">${cellHtml("timeline", r, c)}</td>`).join("")}
              <td class="px-2 py-1.5 opacity-0 group-hover:opacity-100 transition"><button onclick="deleteRow('timeline','${r.id}')" class="text-slate-400 hover:text-red-600 text-xs">삭제</button></td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* ---------------- Export / Import ---------------- */
function exportJson(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "tigerclub_admin_" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); URL.revokeObjectURL(url);
}
function importJsonFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.cohorts || !parsed.settings) throw new Error("invalid");
      state = parsed; saveState(); render();
      alert("데이터를 불러왔습니다.");
    }catch(err){ alert("올바른 JSON 파일이 아닙니다."); }
  };
  reader.readAsText(file); input.value = "";
}
function resetSample(){
  if(!confirm("초기 샘플(2기 실데이터)로 되돌릴까요? 현재 데이터는 사라집니다.")) return;
  state = JSON.parse(JSON.stringify(SEED)); saveState(); render();
}

/* ---------------- 메인 렌더 ---------------- */
function setTab(tab){ currentTab = tab; statsNonce++; render(); }

function render(){
  const app = document.getElementById("app");
  const tabs = [
    ["eval","활동사항"],
    ["roster","크리에이터 명단"],
    ["timeline","타임라인"],
    ["settings","설정"],
  ];
  let body = "";
  if(currentTab==="eval") body = renderEvalTab();
  else if(currentTab==="roster") body = renderGenericTable("roster","크리에이터 명단");
  else if(currentTab==="timeline") body = renderTimelineTab();
  else if(currentTab==="settings") body = renderSettingsTab();

  app.innerHTML = `
    <div class="flex flex-col md:flex-row min-h-screen">
      <aside class="w-full md:w-56 md:shrink-0 bg-gradient-to-r md:bg-gradient-to-b from-orange-500 to-orange-600 text-white md:sticky md:top-0 md:h-screen md:overflow-y-auto">
        <div class="flex flex-row md:flex-col items-center md:items-stretch gap-2 md:gap-1 p-3 md:p-4 overflow-x-auto md:overflow-visible">
          <div class="shrink-0 md:mb-6 md:px-1 pr-2 md:pr-0 border-r md:border-r-0 border-white/20">
            <div class="font-extrabold text-base md:text-lg leading-tight whitespace-nowrap">🐯 호랑이클럽</div>
            <div class="hidden md:block text-orange-100 text-xs mt-0.5">운영진 대시보드</div>
          </div>
          <nav class="flex flex-row md:flex-col gap-1 shrink-0">
            ${tabs.map(([id,label])=>`<button onclick="setTab('${id}')" class="text-left px-3 py-2 md:py-2.5 rounded-lg text-sm font-semibold transition whitespace-nowrap ${currentTab===id ? "bg-white text-orange-600 shadow-sm" : "text-white/90 hover:bg-white/10"}">${label}</button>`).join("")}
          </nav>
          <div class="shrink-0 ml-auto md:ml-0 md:mt-auto md:pt-4 md:border-t md:border-white/20">
            <button onclick="resetSample()" class="text-[11px] md:text-xs text-orange-100 hover:text-white whitespace-nowrap">초기화</button>
          </div>
        </div>
      </aside>
      <main class="flex-1 min-w-0 p-4 md:p-8 overflow-x-hidden">
        <div class="max-w-[1400px] mx-auto">
          <p class="text-[11px] text-amber-600 mb-3 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">⚠️ 공개 열람용 링크입니다. 명단의 개인정보(실명·연락처·주소·이메일)는 포함되어 있지 않습니다.</p>
          ${body}
        </div>
      </main>
    </div>
    ${renderEventModal()}
  `;
  if(editingCell){
    const el = document.getElementById("active-cell-input");
    if(el){ el.focus(); if(el.select) el.select(); }
  }
  if(currentTab==="eval" && statsNonce !== lastAnimatedStatsNonce){
    lastAnimatedStatsNonce = statsNonce;
    animateStatNumbers();
  }
}

render();
</script>
